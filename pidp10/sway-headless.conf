# Headless sway-config voor de PiDP-10 webconsole.
# Vervangt cage: sway tegelt (tiled) meerdere vensters vanzelf naast elkaar,
# zodat Knight TV (tvcon) en Type 340 (simh dpy) gelijktijdig zichtbaar zijn
# i.p.v. elkaar te verdringen zoals bij cage.

output HEADLESS-1 resolution 1280x720

default_orientation horizontal
default_border none
focus_follows_mouse no

# geen bar (geen i3status/waybar aanwezig, en niet nodig headless)

exec bash -c 'while true; do /opt/pidp10/bin/tvcon -2BS localhost; sleep 1; done'

# tvcon en simh's dpy-venster hebben vaste-grootte hints, dus sway zou ze
# standaard als floating behandelen (geen auto-tiling). Forceer tiling zodat
# ze automatisch naast elkaar getoond worden.
for_window [class="tvcon"] floating disable
for_window [class="pidp10"] floating disable
